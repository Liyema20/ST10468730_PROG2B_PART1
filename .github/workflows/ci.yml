 name: RaceDay CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate-raceday-project:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check required project files
        run: |
          echo "Checking RaceDay project files..."

          test -f README.md
          test -f Changelog
          test -f RaceDayDB.sql
          test -f raceday_erd.png
          test -f "API_Endpoint_Reference (1).docx"

          echo "All required RaceDay files are present."

      - name: Check SQL database entities
        run: |
          echo "Checking RaceDay SQL database..."

          grep -qi "CREATE TABLE Users" RaceDayDB.sql
          grep -qi "CREATE TABLE Events" RaceDayDB.sql
          grep -qi "CREATE TABLE EventRoutes" RaceDayDB.sql
          grep -qi "CREATE TABLE Categories" RaceDayDB.sql
          grep -qi "CREATE TABLE Enrolments" RaceDayDB.sql
          grep -qi "CREATE TABLE Results" RaceDayDB.sql

          echo "All 6 RaceDay entities found."

      - name: Check SQL seed data
        run: |
          echo "Checking sample data..."

          grep -qi "INSERT INTO Users" RaceDayDB.sql
          grep -qi "INSERT INTO Events" RaceDayDB.sql
          grep -qi "INSERT INTO Categories" RaceDayDB.sql
          grep -qi "INSERT INTO Enrolments" RaceDayDB.sql

          echo "Sample data found."

      - name: RaceDay CI validation successful
        run: |
          echo "======================================"
          echo "RaceDay CI validation successful!"
          echo "All required files and SQL entities"
          echo "have passed the project checks."
          echo "======================================"
